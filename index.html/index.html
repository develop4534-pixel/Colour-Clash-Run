  <body>
    <div id="stage">
      <canvas id="cv" aria-label="Colour Clash Run game"></canvas
      >      <video id="powerupFx" muted playsinline preload="none" aria-hidden="true">
        <source src="ice-cream-powerup-effect.mp4" type="video/mp4" />
      </video><div id="speed-boost-notice" role="status" aria-live="polite" hidden>
        <span class="speed-boost-icon" aria-hidden="true">🥤</span>
        <span class="speed-boost-copy"><strong>SPEED BOOST!</strong><small>Faster for 8 seconds</small></span>
      </div><button id="pb" class="o" hidden aria-label="Pause">⏸</button>
      <div id="ui"></div>
    </div>
    <div id="qc" hidden></div>
    <div id="hint">
      ← → / A D move · Space / W / ↑ jump · mouse: hold controls below · P / K
      paint · 1–4 emotes · team: Z X C V chat, click arena to ping · Esc pause
      (solo)
    </div>
    <div id="ctl">
      <div class="ctl-pad" role="group" aria-label="Left and right movement joystick">
        <span class="joystick-arrow joystick-left" aria-hidden="true">←</span>
        <span class="joystick-arrow joystick-right" aria-hidden="true">→</span>
        <span class="joystick-knob" aria-hidden="true"></span>
      </div>
      <div class="ctl-actions">
        <div id="ctl-color-picker" class="ctl-color-picker" hidden aria-label="Choose player color"></div>
        <button class="cb ctl-emote" data-a="e" aria-label="Emote">😄</button>
        <button class="cb ctl-paint" data-a="palette" aria-label="Choose player color" aria-expanded="false">🎨</button>
        <button class="cb ctl-jump" data-a="j" aria-label="Jump">⬆</button>
      </div>
    </div>
    <style>
      :root {
        --bg: #0e1330;
        --tx: #f2f6ff;
        --pn: rgba(20, 26, 60, 0.96);
        --ac: #c9a8ff;
        --on: #10122a;
        --bd: #f2f6ff;
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      };
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1330;
          --tx: #f2f6ff;
          --pn: rgba(20, 26, 60, 0.96);
          --ac: #c9a8ff;
          --on: #10122a;
          --bd: #f2f6ff;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1330;
        --tx: #f2f6ff;
        --pn: rgba(20, 26, 60, 0.96);
        --ac: #c9a8ff;
        --on: #10122a;
        --bd: #f2f6ff;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font-family:
          "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: min(100vw, calc((100dvh - 96px) * 1.4815));
        aspect-ratio: 800/540;
        container-type: inline-size;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
      }
      canvas#cv {
        width: 100%;
        height: 100%;
        display: block;
      }
      #powerupFx {
        display: none;
        position: absolute;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #powerupFx.active {
        display: block;
      }
      #speed-boost-notice {
        position: absolute;
        z-index: 3;
        top: 19%;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 10px;
        width: max-content;
        max-width: calc(100% - 32px);
        box-sizing: border-box;
        padding: 10px 18px;
        border: 2px solid #9cff67;
        border-radius: 20px;
        background: linear-gradient(135deg, rgba(19, 49, 29, 0.97), rgba(17, 24, 42, 0.97));
        color: #fff8d6;
        box-shadow: 0 0 12px #7dff49, 0 0 32px rgba(125, 255, 73, 0.8), inset 0 0 12px rgba(125, 255, 73, 0.2);
        transform: translateX(-50%);
        pointer-events: none;
        animation: speed-boost-notice 3.5s ease both;
      }
      #speed-boost-notice[hidden] {
        display: none;
      }
      .speed-boost-icon {
        font-size: clamp(26px, 8vw, 42px);
        line-height: 1;
        filter: drop-shadow(0 0 8px #9cff67);
      }
      .speed-boost-copy {
        display: grid;
        gap: 2px;
        text-align: left;
      }
      .speed-boost-copy strong {
        color: #caff8c;
        font-size: clamp(15px, 4.3vw, 22px);
        line-height: 1.1;
        letter-spacing: 0.04em;
        text-shadow: 0 0 8px rgba(156, 255, 103, 0.7);
      }
      .speed-boost-copy small {
        font-size: clamp(11px, 3vw, 14px);
      }
      @keyframes speed-boost-notice {
        0% { opacity: 0; transform: translate(-50%, 18px) scale(0.72); }
        12%, 78% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -12px) scale(0.94); }
      }
      @media (prefers-reduced-motion: reduce) {
        #speed-boost-notice {
          animation-name: speed-boost-notice-reduced;
        }
        @keyframes speed-boost-notice-reduced {
          0%, 80% { opacity: 1; }
          100% { opacity: 0; }
        }
      }
      #ui {
        position: absolute;
        z-index: 2;
        inset: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        font-size: max(10px, 2cqw);
        overflow: auto;
        box-sizing: border-box;
        padding: 8px;
      }
      .panel {
        background: var(--pn);
        color: var(--tx);
        border-radius: 1.2em;
        padding: 0.8em 1.3em;
        max-width: 94%;
        text-align: center;
        box-shadow: 0 0.4em 2em rgba(0, 0, 0, 0.35);
        margin: auto;
      }
      .menu-panel {
        box-sizing: border-box;
        width: min(100%, 920px);
        max-width: 100%;
        max-height: 100%;
        overflow: auto;
        overscroll-behavior: contain;
        padding: clamp(0.65em, 1.4cqw, 1.1em) clamp(0.7em, 1.8cqw, 1.4em);
        border: 2px solid rgba(191, 145, 255, 0.85);
        background:
          radial-gradient(ellipse at 50% -12%, rgba(159, 94, 255, 0.28), transparent 58%),
          linear-gradient(155deg, rgba(24, 23, 65, 0.98), rgba(12, 20, 48, 0.98));
        box-shadow:
          0 0.6em 2.2em rgba(0, 0, 0, 0.52),
          0 0 1.1em rgba(133, 91, 255, 0.3),
          inset 0 1px rgba(255, 255, 255, 0.14);
      }
      .menu-panel h1 {
        color: #fff0a8;
        letter-spacing: 0.025em;
        text-shadow: 0 0 0.35em rgba(255, 211, 102, 0.48);
      }
      .xp-wallet {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.55em;
        width: max-content;
        max-width: 100%;
        box-sizing: border-box;
        margin: 0 auto 0.45em;
        padding: 0.35em 0.9em;
        border: 2px solid #ffd34f;
        border-radius: 1em;
        background: linear-gradient(140deg, rgba(89, 61, 24, 0.92), rgba(32, 26, 61, 0.96));
        box-shadow: 0 0 14px rgba(255, 211, 79, 0.3), inset 0 1px rgba(255, 255, 255, 0.18);
        text-align: left;
      }
      .xp-wallet-icon {
        flex: 0 0 auto;
        font-size: 1.65em;
        line-height: 1;
      }
      .xp-wallet-copy {
        display: grid;
        gap: 0.05em;
        line-height: 1.1;
      }
      .xp-wallet-copy small {
        margin: 0;
        color: #fff0b0;
        font-size: 0.72em;
      }
      .xp-wallet-copy strong {
        color: #ffe281;
        font-size: 1.2em;
        font-variant-numeric: tabular-nums;
      }
      .menu-profiles {
        grid-column: 1 / -1;
      }
      .menu-profiles .row > b {
        color: #b8f3ff;
      }
      .menu-profiles .row > strong {
        color: #ffe281;
      }
      .menu-level .row {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .menu-level .row > b {
        grid-column: 1 / -1;
      }
      .menu-profiles small {
        text-align: center;
      }
      .menu-hero button.o.affordable {
        border-color: #ffe281;
        background: linear-gradient(180deg, #725d24, #44341d);
      }
      .menu-intro {
        color: #e7edff;
      }
      .menu-section .row > b {
        color: #b8f3ff;
        text-shadow: 0 0 0.4em rgba(87, 220, 255, 0.35);
      }
      .menu-footer {
        color: #d3dcf5;
      }
      .welcome-panel {
        box-sizing: border-box;
        width: min(100%, 460px);
        max-height: 100%;
        overflow: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(0.7em, 2cqw, 1em);
        padding: clamp(1.2em, 4cqw, 2em);
        border: 1px solid rgba(255, 212, 59, 0.45);
        background:
          radial-gradient(ellipse at 50% 0, rgba(255, 212, 59, 0.16), transparent 55%),
          var(--pn);
        animation: welcome-display-glow 2.8s ease-in-out infinite alternate;
      }
      .welcome-panel h1 {
        margin: 0;
        font-size: clamp(2.4rem, 9cqw, 4rem);
        animation: welcome-enter 500ms ease-out both;
        text-shadow: 0 0 12px rgba(255, 212, 59, 0.55);
      }
      .welcome-game-title {
        margin: -0.65em 0 0;
        color: #ffe783;
        font-size: clamp(1.2rem, 4.8cqw, 1.8rem);
        letter-spacing: 0.04em;
        text-shadow: 0 0 12px rgba(255, 212, 59, 0.4);
        animation: welcome-enter 500ms ease-out 120ms both;
      }
      .welcome-dots {
        display: flex;
        gap: 0.65em;
        padding: 0.25em 0;
      }
      .welcome-dots span {
        width: clamp(0.7rem, 3cqw, 1.1rem);
        aspect-ratio: 1;
        border-radius: 50%;
        opacity: 0;
        animation:
          welcome-dot-enter 650ms cubic-bezier(0.2, 0.8, 0.3, 1.2) both,
          welcome-light-pulse 1.6s ease-in-out 800ms infinite alternate;
      }
      .welcome-dots span:nth-child(1) {
        background: #ffd43b;
        --light-glow: rgba(255, 212, 59, 0.8);
        animation-delay: 120ms;
      }
      .welcome-dots span:nth-child(2) {
        background: #40d879;
        --light-glow: rgba(64, 216, 121, 0.8);
        animation-delay: 280ms;
      }
      .welcome-dots span:nth-child(3) {
        background: #ff5353;
        --light-glow: rgba(255, 83, 83, 0.8);
        animation-delay: 440ms;
      }
      @keyframes welcome-display-glow {
        from {
          box-shadow: 0 0.4em 2em rgba(0, 0, 0, 0.35), 0 0 12px rgba(255, 212, 59, 0.12);
        }
        to {
          box-shadow: 0 0.4em 2em rgba(0, 0, 0, 0.35), 0 0 28px rgba(255, 212, 59, 0.38);
        }
      }
      @keyframes welcome-enter {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes welcome-dot-enter {
        0% {
          opacity: 0;
          transform: translateY(14px) scale(0.35);
        }
        65% {
          opacity: 1;
          transform: translateY(-4px) scale(1.15);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes welcome-light-pulse {
        from {
          box-shadow: 0 0 5px var(--light-glow);
        }
        to {
          box-shadow: 0 0 18px var(--light-glow), 0 0 28px var(--light-glow);
        }
      }
      .welcome-start {
        min-height: 48px;
        animation: welcome-enter 500ms ease-out 600ms both;
      }
      .welcome-logo {
        display: block;
        width: min(40%, 145px);
        height: auto;
        padding: 0.2em 0.35em;
        border-radius: 0.65em;
        background: #fff;
        animation: welcome-enter 500ms ease-out 720ms both;
      }
      .welcome-brand-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(0.45em, 2cqw, 0.8em);
        width: 100%;
      }
      .welcome-game-mark {
        display: block;
        width: clamp(2.5rem, 9cqw, 3.2rem);
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 0.9em;
        box-shadow: 0 0 14px rgba(64, 216, 121, 0.3);
        animation: welcome-enter 500ms ease-out 820ms both;
      }
      @media (prefers-reduced-motion: reduce) {
        .welcome-panel h1,
        .welcome-game-title,
        .welcome-dots span,
        .welcome-start,
        .welcome-logo,
        .welcome-game-mark {
          animation: none;
          opacity: 1;
        }
        .welcome-panel {
          animation: none;
        }
      }
      .menu-layout {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(0.35em, 0.8cqw, 0.65em) clamp(0.55em, 1.2cqw, 1em);
        align-items: start;
      }
      .menu-intro,
      .menu-arena,
      .menu-hero,
      .menu-palette,
      .menu-profiles,
      .menu-level,
      .menu-room,
      .menu-actions,
      .menu-footer {
        grid-column: 1 / -1;
      }
      .menu-intro {
        max-width: 58em;
        margin: 0 auto;
        line-height: 1.3;
      }
      .menu-section {
        min-width: 0;
        margin: 0;
        padding: 0.35em 0.5em;
        border: 1px solid rgba(130, 183, 255, 0.38);
        border-radius: 0.8em;
        background:
          linear-gradient(145deg, rgba(104, 86, 190, 0.16), rgba(18, 36, 76, 0.44));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.07);
      }
      .menu-section .row {
        margin: 0;
        gap: 0.4em;
      }
      .menu-section .row > b {
        min-width: 4.2em;
      }
      .menu-hero .avatar-progress {
        display: block;
        margin: 0.15em 0.25em;
        color: #d7efff;
        font-size: 0.8em;
      }
      .menu-hero .avatar-lock {
        display: block;
        color: #ffe59a;
        font-size: 0.72em;
        line-height: 1;
      }
      .row.menu-volume {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
      }
      .menu-volume label {
        min-width: 4.2em;
        text-align: right;
      }
      .menu-volume input[type="range"] {
        flex: 1 1 10em;
        width: auto;
        min-width: 6em;
        padding: 0;
        border: 0;
        accent-color: #c9a8ff;
      }
      .menu-volume output {
        min-width: 3em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .menu-palette .row {
        gap: 0.3em;
      }
      .menu-palette .color-choice {
        display: inline-flex;
        align-items: center;
        gap: 0.32em;
        padding: 0.2em 0.45em;
      }
      .color-choice-dot {
        width: 1em;
        height: 1em;
        flex: 0 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        background: var(--swatch);
        box-shadow: 0 0 0.5em var(--swatch);
      }
      .menu-arena .row > button.o {
        flex: 1 1 auto;
      }
      .menu-code input {
        min-width: 0;
        flex: 0 1 7em;
      }
      .menu-actions {
        position: sticky;
        bottom: -1px;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.35em;
        padding: 0.35em 0;
        background: var(--pn);
      }
      .menu-actions > button {
        margin: 0;
      }
      .menu-footer {
        margin-top: 0;
        text-align: center;
        line-height: 1.3;
      }
      @container (max-width: 560px) {
        .menu-layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .menu-intro,
        .menu-arena,
        .menu-hero,
        .menu-palette,
        .menu-room,
        .menu-actions,
        .menu-footer {
          grid-column: 1;
        }
        .menu-section {
          padding: 0.3em 0.4em;
        }
        .menu-section .row > b {
          flex-basis: 4.2em;
        }
      }
      .congrats-panel {
        position: relative;
        box-sizing: border-box;
        width: min(100%, 560px);
        max-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: clamp(0.65em, 1.6cqw, 1.1em) clamp(0.7em, 2.2cqw, 1.4em);
        font-size: clamp(12px, 2cqw, 20px);
        border: 3px solid #ffd900;
        border-radius: 1em;
        background:
          radial-gradient(ellipse at 50% 45%, rgba(21, 34, 67, 0.96), transparent 72%),
          #09101f;
        color: #edf2ff;
        box-shadow: 0 0 24px rgba(255, 214, 0, 0.28), 0 12px 44px #050817aa;
      }
      .congrats-panel > :not(.celebration-confetti) {
        position: relative;
        z-index: 1;
      }
      .congrats-panel h1 {
        margin: 0.15em 0 0.45em;
        color: #ffd900;
        font-size: clamp(1.5em, 6cqw, 2.55em);
        letter-spacing: 0.035em;
        text-shadow: 0 0 8px rgba(255, 214, 0, 0.65);
        overflow-wrap: anywhere;
      }
      .congrats-message {
        margin: 0.5em 0;
        color: #dce7ff;
        font-size: 1.08em;
      }
      .character-xp-result {
        margin: 0.5em 0;
        padding: 0.45em 0.6em;
        border: 1px solid rgba(133, 225, 255, 0.55);
        border-radius: 0.65em;
        background: rgba(32, 91, 126, 0.35);
        color: #c9f6ff;
        font-weight: 700;
        text-align: center;
      }
      .congrats-next {
        margin: 0.65em 0;
        color: #9bff70;
        font-size: 1.22em;
        font-weight: 800;
        text-shadow: 0 0 12px rgba(42, 255, 31, 0.72);
      }
      .congrats-bonus-label {
        margin-top: 0.35em;
        color: #d5e0f7;
        font-size: 0.86em;
        letter-spacing: 0.1em;
      }
      .congrats-bonus {
        margin: 0.05em 0 0.28em;
        color: #18ff37;
        font-size: clamp(1.7em, 7cqw, 2.5em);
        font-weight: 900;
        line-height: 1.05;
        text-shadow: 0 0 8px #12f42e, 0 0 20px #0ed52f;
      }
      .congrats-details {
        margin: 0.35em 0;
        color: #bdc8de;
        font-size: 0.78em;
      }
      .congrats-details summary {
        cursor: pointer;
      }
      .celebration-confetti {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .celebration-confetti i {
        position: absolute;
        top: -14px;
        left: var(--x);
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background: var(--color);
        box-shadow: 0 0 7px var(--color);
        opacity: 0;
        animation: congratulations-confetti var(--duration) ease-in var(--delay) infinite;
      }
      .celebration-confetti i:nth-child(3n) {
        width: calc(var(--size) * 0.65);
        height: calc(var(--size) * 1.8);
        border-radius: 2px;
      }
      @keyframes congratulations-confetti {
        0% {
          transform: translate3d(0, -8px, 0) rotate(0);
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        88% {
          opacity: 0.9;
        }
        100% {
          transform: translate3d(var(--drift), 340px, 0) rotate(var(--spin));
          opacity: 0;
        }
      }
      .congrats-panel .congrats-next-button {
        display: block;

      function connectRoom(key) {
        return new Promise((resolve, reject) => {

              endpoint = roomEndpoint();
            } catch (error) {
              reject(error);
              return;

            const socket = new WebSocket(endpoint);
            const peers = new Map();
            const listeners = new Map();
            const peerListeners = new Set();
            let joined = false;
            let closed = false;
            let joinError = "";
            const notifyPeers = () => {
              for (const callback of peerListeners) {
                try {
                  callback();
                } catch (error) {
                  console.error("Room peer listener failed:", error);
                }
              }

            const dispatch = (type, message) => {
              for (const callback of listeners.get(type) || []) {

                    peer: peer.peer,

                    sameTab: false,

          ctx.globalAlpha = cl(p.emT * 2, 0, 1);
          ctx.fillText(
            p.emo,
            p.x + 14,
            p.y - 18 - (S.rm ? 0 : (1.6 - p.emT) * 10),
          );
          ctx.globalAlpha = 1;
        }
        ctx.restore();
        if (G.speedFx > 0) {
          ctx.save();
          ctx.globalAlpha = Math.min(0.7, G.speedFx * 0.7);
          for (let i = 0; i < 32; i++) {
            const angle = (i / 32) * Math.PI * 2 + G.anim * 0.2,
              inner = 42 + (i % 4) * 15,
              outer = Math.max(W, H) * 0.72;
            ctx.beginPath();
            ctx.moveTo(
              W / 2 + Math.cos(angle) * inner,
              H / 2 + Math.sin(angle) * inner,
            );
            ctx.lineTo(
              W / 2 + Math.cos(angle) * outer,
              H / 2 + Math.sin(angle) * outer,
            );
            ctx.strokeStyle = "#fff7d5";
            ctx.lineWidth = i % 3 === 0 ? 3 : 1.5;
            ctx.stroke();
          }
          ctx.restore();
        }
        /* HUD */
        if (isMobileViewport) drawMobileHUD();
        else {
          const ky = 26;
          if (p.speedBoost > 0)
            txt("SPEED BOOST " + Math.ceil(p.speedBoost) + "s", 18, 68, 13, "#ffe0a0");
          txt("Level " + G.level, 18, 48, 12, "#fff0a8");
          txt("★ " + G.starCount + "/" + G.stars.length, 90, 48, 12, "#ffe06a");
          txt("Score " + G.score, 46, ky, 18);
          txt("♥ " + G.hc + "/6", 150, ky, 18, "#ff8aa0");
          txt("HP", 215, ky, 13, "#e8dce3");
          for (let i = 0; i < 3; i++) {
            heart(243 + i * 15, ky, 6);
            ctx.fillStyle = i < G.hp ? "#ff526e" : "#514451";
            ctx.fill();
            ctx.strokeStyle = "#211a2c";
            ctx.lineWidth = 1;
            ctx.stroke();
          }
          txt(
            G.key ? "★ Key ✓" : "★ Key —",
            300,
            ky,
            18,
            G.key ? "#ffd54a" : "#d0d0e0",
          );
          if (!a.core)
            txt(
              "Steps " + G.steps + "/" + G.stepTotal,
              410,
              ky,
              15,
              G.steps === G.stepTotal ? "#b7ff5a" : "#fff",
            );
          txt(
            p.pcd > 0 ? "🎨 " + Math.ceil(p.pcd) + "s" : "🎨 ready",
            515,
            ky,
            16,
            p.pcd > 0 ? "#d0d0e0" : "#fff",
          );
          const left = Math.max(0, Math.ceil(ROUND - G.t));
          txt(left + "s", 617, ky, 20, left <= 10 ? "#ffb0a0" : "#fff", "center");
          const cl2 = G.ph >= G.clashTime,
            pu = warn && !S.rm ? 1 + 0.08 * Math.sin(G.anim * 14) : 1;
          ctx.save();
          ctx.translate(W - 62, 22);
          ctx.scale(pu, pu);
          swatch(-44, -14, 88, 28, G.called, 1);
          ctx.restore();
          txt(
            cl2
              ? "CLASH!"
              : "Clash in " + Math.max(0, Math.ceil(G.clashTime - G.ph)) + "s",
            W - 14,
            50,
            15,
            cl2 || warn ? "#ffb0a0" : "#fff",
            "right",
          );
          ctx.fillStyle = "rgba(10,10,40,.6)";
          rr(W - 212, 18, 10, 10, 3);
          ctx.fillStyle = "rgba(10,10,40,.6)";
          rr(560, 18, 0, 0, 0);
          const bx = 520,
            bw = 130;
          ctx.fillStyle = "rgba(10,10,40,.6)";
          rr(bx, 42, bw, 8, 4);
          ctx.fill();
          ctx.fillStyle = "#fff";
          rr(bx, 42, Math.max(8, (bw * G.ph) / 10), 8, 4);
          ctx.fill();
          ctx.fillStyle = "#ff6b5e";
          ctx.fillRect(bx + (bw * G.clashTime) / 10, 39, 3, 14);
        }
        if (S.mode === "race") {
          const x0 = 70,
            x1 = 730,
            y = isMobileViewport ? 170 : 66;
          ctx.fillStyle = "rgba(10,10,40,.55)";
          rr(x0 - 10, y - 8, x1 - x0 + 20, 16, 8);
          ctx.fill();
          G.bots.forEach((b, i) => {
            const q =
              b.fin <= G.t
                ? 1
                : cl(G.t / b.fin + 0.03 * Math.sin(G.t * 1.7 + i), 0, 1);
            ctx.beginPath();
            ctx.arc(x0 + (x1 - x0) * q, y + ((i % 3) - 1) * 3, 5, 0, 7);
            ctx.fillStyle = AV[(i + 1 + S.av) % AV.length].b;
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "#111";
            ctx.stroke();
          });
          ctx.beginPath();
          ctx.arc(x0 + (x1 - x0) * prog(), y, 8, 0, 7);
          ctx.fillStyle = PLAYER_COLORS[S.color].c;
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#fff";
          ctx.stroke();
          ctx.font = "16px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText("🏁", x1 + 16, y);
        } else if (!isMobileViewport && G.gh)
          txt("Ghost best " + G.gh.t.toFixed(1) + "s", 14, 60, 13, "#d8f0ff");
        if (S.mode === "team" && G.mates.length) {
          const x0 = 70,
            x1 = 730,
            y = isMobileViewport ? 170 : 66;
          ctx.fillStyle = "rgba(10,10,40,.55)";
          rr(x0 - 10, y - 8, x1 - x0 + 20, 16, 8);
          ctx.fill();
          for (const m of G.mates) {
            ctx.beginPath();
            ctx.arc(x0 + (x1 - x0) * cl(m.pr, 0, 1), y, 6, 0, 7);
            ctx.fillStyle = AV[m.av].b;
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "#111";
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(x0 + (x1 - x0) * prog(), y, 8, 0, 7);
          ctx.fillStyle = PLAYER_COLORS[S.color].c;
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#fff";
          ctx.stroke();
          ctx.font = "16px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText("🏁", x1 + 16, y);
        }
        if (scr === "play") drawObjectiveArrow();
        txt(
          objective(),
          W / 2,
          isMobileViewport ? H * 0.46 : 490,
          isMobileViewport ? 26 : 16,
          "#d8f0ff",
          "center",
        );
        if (G.msg)
          txt(
            G.msg.s,
            W / 2,
            isMobileViewport ? H * 0.5 : 515,
            isMobileViewport ? 28 : 19,
            "#fff",
            "center",
          );
      }
      let last = 0,
        lastDraw = 0,
        updateAccumulator = 0;
      function loop(ts) {
        requestAnimationFrame(loop);
        const dt = Math.min(0.1, Math.max(0, (ts - last) / 1000) || 0);
        last = ts;
        try {
          if (lobDirty && scr === "lobby" && ts - lobT > 250) {
            lobDirty = false;
            lobT = ts;
            lobbyUI();
          }
          if (scr === "play") {
            updateAccumulator = Math.min(0.1, updateAccumulator + dt);
            if (updateAccumulator >= 1 / 60) {
              update(updateAccumulator);
              updateAccumulator = 0;
            }
          } else {
            updateAccumulator = 0;
            update(dt);
          }
          const backgroundArena =
            G && scr !== "menu" && scr !== "lobby" ? G.ar : S.ar;
          const animateBackground =
            !S.rm && AR[backgroundArena].halloween === "pumpkin";
          const frameInterval = isMobileViewport ? 1000 / 30 : 1000 / 60;
          if (
            (scr === "play" && ts - lastDraw >= frameInterval) ||
            canvasDirty ||
            (animateBackground && ts - lastDraw >= 1000 / 30)
          ) {
            draw();
            canvasDirty = false;
            lastDraw = ts;
          }
        } catch (err) {
          console.error(err);
        }
      }
      welcome();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
